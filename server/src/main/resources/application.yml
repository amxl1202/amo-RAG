spring:
  application:
    name: ragkb-server
  config:
    # 用 Spring Boot 自带的配置导入读 .env,不依赖 spring-dotenv。
    # [.properties] 指定按 properties 格式解析;optional: 让文件缺失时不阻断启动
    # (CI 与别人克隆仓库时没有 .env,应当照常能起)。
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rag_kb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:rag123456}
  sql:
    init:
      # 建表语句全部用 IF NOT EXISTS,重复执行无害
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.ragkb: INFO

app:
  storage:
    root: ${STORAGE_ROOT:./data/files}
  upload:
    max-size-mb: 50
  # 向量化配置。dimension 刻意<b>不</b>开放为环境变量:它和 schema.sql 里的 vector(512)
  # 以及 CHECK (dim = 512) 强绑定,配成别的值只会在"调用已经花钱之后"才被数据库拦住。
  # 要换维度就是一次迁移(改 DDL、重刷全量向量、重建 HNSW 索引),不是改配置。
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-v3}
      # 维度与 schema.sql 的 vector(512) / CHECK(dim = 512) 强绑定,不开放为环境变量
      dimension: 512
      batch-size: ${EMBEDDING_BATCH_SIZE:10}
      # 默认公共 DashScope;专属实例(百炼 MaaS)用 EMBEDDING_ENDPOINT 覆盖,别把实例地址写进仓库
      endpoint: ${EMBEDDING_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
      max-attempts: ${EMBEDDING_MAX_ATTEMPTS:3}
      # 对话模型。与向量模型共用 api-key:专属实例里两者是同一套凭据,
      # 拆成两份配置只会让"换 Key 时改了一半"这种事有发生的可能。
      # 温度取 0.2:生成层要照材料说,但 0 在长文本里容易陷入重复。
      chat-model: ${CHAT_MODEL:qwen-plus}
      chat-endpoint: ${CHAT_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      chat-temperature: ${CHAT_TEMPERATURE:0.2}
      chat-max-tokens: ${CHAT_MAX_TOKENS:800}
      chat-timeout-seconds: ${CHAT_TIMEOUT_SECONDS:60}
      chat-max-attempts: ${CHAT_MAX_ATTEMPTS:3}
  # 生成策略:与供应商无关,换语料才需要动。
  # 5 条 / 2000 token 的依据见 PromptBuilder.defaultLimits 的注释。
  generation:
    max-evidence: ${GENERATION_MAX_EVIDENCE:5}
    max-context-tokens: ${GENERATION_MAX_CONTEXT_TOKENS:2000}
    # 阶段一拒答的两个阈值。必须由评估集反推,改它们等于改"何时拒答",
    # 必须重跑 docs/eval-baseline.md 的拒答准确率与误拒率。
    # 两者是"或"的关系:任一条达标就不拒 —— 中文技术语料里专有名词靠字面命中,
    # 只看相似度会把这类问题误拒。
    min-vector-similarity: ${GENERATION_MIN_VECTOR_SIMILARITY:0.45}
    min-keyword-coverage: ${GENERATION_MIN_KEYWORD_COVERAGE:0.5}
  retrieval:
    # 单通道超时:超过就降级为空列表,另一路照常用
    timeout-ms: ${RETRIEVAL_TIMEOUT_MS:800}
    # ILIKE / TRGM。对比实验显示两者在当前语料上无差异,TRGM 的候选集是 ILIKE 的超集
    keyword-mode: ${KEYWORD_MODE:TRGM}
