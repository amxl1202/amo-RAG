spring:
  application:
    name: ragkb-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rag_kb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:rag123456}
  sql:
    init:
      # 建表语句全部用 IF NOT EXISTS,重复执行无害
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.ragkb: INFO

app:
  storage:
    root: ${STORAGE_ROOT:./data/files}
  upload:
    max-size-mb: 50
  # 向量化配置。dimension 刻意<b>不</b>开放为环境变量:它和 schema.sql 里的 vector(512)
  # 以及 CHECK (dim = 512) 强绑定,配成别的值只会在"调用已经花钱之后"才被数据库拦住。
  # 要换维度就是一次迁移(改 DDL、重刷全量向量、重建 HNSW 索引),不是改配置。
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      embedding-model: ${EMBEDDING_MODEL:text-embedding-v3}
      embedding-dimension: 512
      embedding-batch-size: ${EMBEDDING_BATCH_SIZE:10}
      timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
      max-attempts: ${EMBEDDING_MAX_ATTEMPTS:3}
